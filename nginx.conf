server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Scripts et donnees compresses a la volee (la scene .glb l'est deja).
    gzip on;
    gzip_types text/javascript application/javascript application/json text/css;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Fichiers utiles seulement sur le PC (lanceur local) : non publies.
    location ~* \.(ps1|bat|dockerignore)$ { return 404; }
}
